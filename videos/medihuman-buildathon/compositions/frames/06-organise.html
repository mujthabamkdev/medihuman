        const one = (name) => root.querySelector('[class~="06-organise-' + name + '"]');
        const rows = root.querySelectorAll('[class~="06-organise-question-row"]');
        const timeline = gsap.timeline({ paused: true });

        // First phase: establish workspace, then accumulate categories on spoken cues.

          timeline.fromTo(one(name), { x, y, scale: .97, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 1, ease: 'power3.out' }, at);
        });

        // Second phase: saved questions become focal; entries keep arriving in back half.
        timeline.fromTo(one('questions'), { y: 20, scale: .985, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1, ease: 'power3.out' }, 5.35);
        timeline.fromTo(one('saved'), { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: .65, ease: 'power3.out' }, 6.15);
        rows.forEach((row, index) => {
          timeline.fromTo(row, { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: .85, ease: 'power3.out' }, 6.7 + index * 1.05);

        timeline.fromTo(one('progress-fill'), { scaleX: .82 }, { scaleX: 1, duration: 12, ease: 'none' }, 0);

        // One deterministic camera writer: steady push with subtle independent drift.
        const phase = { scale: 1 };
        const drift = { p: 0 };
        timeline.to(phase, { scale: 1.004, duration: 5.6, ease: 'none' }, 0);
